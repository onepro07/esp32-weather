<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-sky="clear">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="天气">
<meta name="application-name" content="天气">
<title>实时天气 · ESP32</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light dark}

:root{
  --acc:#7fb6ff;
  --card:rgba(255,255,255,.85);
  --card-brd:rgba(255,255,255,.90);
  --hi:rgba(255,255,255,.98);
  --sheen:rgba(255,255,255,.50);
  --ink:#14161c;
  --ink2:rgba(24,28,40,.70);
  --ink3:rgba(24,28,40,.50);
  --link:#2f6ee0;
  --fill:rgba(255,255,255,.62);
  --fill-brd:rgba(255,255,255,.85);
  --track:rgba(120,125,140,.20);
  --shadow:0 26px 60px -22px rgba(6,10,30,.62),0 2px 10px rgba(6,10,30,.14);
  --r:26px;
  --ease:cubic-bezier(.32,.72,0,1);
}
[data-theme="dark"]{
  --card:rgba(20,24,38,.68);
  --card-brd:rgba(255,255,255,.16);
  --hi:rgba(255,255,255,.28);
  --sheen:rgba(255,255,255,.13);
  --ink:#fff;
  --ink2:rgba(255,255,255,.72);
  --ink3:rgba(255,255,255,.46);
  --link:#8fc0ff;
  --fill:rgba(255,255,255,.08);
  --fill-brd:rgba(255,255,255,.12);
  --track:rgba(255,255,255,.15);
  --shadow:0 26px 60px -22px rgba(0,0,0,.75),0 2px 10px rgba(0,0,0,.32);
}

html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Helvetica Neue","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);background:#0b1020;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;
  transition:color .45s var(--ease);
}

/* ───────── 天空背景：随天气切换 ───────── */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;transition:background 1.2s var(--ease);
  background:
    radial-gradient(145% 62% at 16% -12%,rgba(40,84,190,.92) 0%,transparent 56%),
    radial-gradient(96% 52% at 96% 4%,rgba(150,60,110,.80) 0%,transparent 58%),
    radial-gradient(118% 62% at 44% 112%,rgba(190,110,40,.72) 0%,transparent 62%),
    linear-gradient(180deg,#060911 0%,#0a0c19 46%,#0f0a12 100%);}
[data-sky="cloud"] .bg{background:
    radial-gradient(145% 62% at 16% -12%,rgba(52,74,120,.95) 0%,transparent 58%),
    radial-gradient(96% 52% at 96% 4%,rgba(86,96,128,.75) 0%,transparent 58%),
    radial-gradient(118% 62% at 44% 112%,rgba(70,84,116,.70) 0%,transparent 62%),
    linear-gradient(180deg,#070a12 0%,#0b0e17 46%,#0c0e12 100%);}
[data-sky="rain"] .bg{background:
    radial-gradient(145% 62% at 16% -12%,rgba(24,52,110,.95) 0%,transparent 58%),
    radial-gradient(96% 52% at 96% 4%,rgba(40,58,104,.85) 0%,transparent 58%),
    radial-gradient(118% 62% at 44% 112%,rgba(28,52,92,.80) 0%,transparent 62%),
    linear-gradient(180deg,#040711 0%,#070a14 46%,#08101a 100%);}
[data-sky="snow"] .bg{background:
    radial-gradient(145% 62% at 16% -12%,rgba(96,124,176,.90) 0%,transparent 58%),
    radial-gradient(96% 52% at 96% 4%,rgba(130,150,190,.70) 0%,transparent 58%),
    radial-gradient(118% 62% at 44% 112%,rgba(140,160,200,.60) 0%,transparent 62%),
    linear-gradient(180deg,#0a0f1a 0%,#101724 46%,#121a26 100%);}
[data-sky="night"] .bg{background:
    radial-gradient(145% 62% at 16% -12%,rgba(20,30,90,.95) 0%,transparent 58%),
    radial-gradient(96% 52% at 96% 4%,rgba(60,26,80,.85) 0%,transparent 58%),
    radial-gradient(118% 62% at 44% 112%,rgba(20,34,70,.80) 0%,transparent 62%),
    linear-gradient(180deg,#03050c 0%,#060814 46%,#080611 100%);}
.bg::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 88% at 50% 42%,transparent 40%,rgba(4,7,16,.55) 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(96px);opacity:.30;will-change:transform}
.b1{width:58vmax;height:58vmax;left:-20vmax;top:-16vmax;background:#3a6bff;animation:d1 27s var(--ease) infinite alternate}
.b2{width:48vmax;height:48vmax;right:-18vmax;top:8vmax;background:#ff5a8a;animation:d2 32s var(--ease) infinite alternate}
.b3{width:62vmax;height:62vmax;left:-12vmax;bottom:-26vmax;background:#ffb347;animation:d3 37s var(--ease) infinite alternate}
@keyframes d1{to{transform:translate(8vmax,6vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(-7vmax,11vmax) scale(1.1)}}
@keyframes d3{to{transform:translate(11vmax,-8vmax) scale(1.08)}}

/* ───────── 布局 ───────── */
.app{position:relative;z-index:1;width:100%;max-width:440px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 26px);
  display:flex;flex-direction:column;gap:13px}

.top{display:flex;align-items:center;gap:10px;padding:6px 4px 10px}
.brand{flex:1;min-width:0}
.brand h1{font-size:22px;font-weight:600;letter-spacing:-.2px;line-height:1.15;color:#fff;
  text-shadow:0 1px 12px rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{font-size:11px;color:rgba(255,255,255,.52);letter-spacing:1.1px;margin-top:4px;text-transform:uppercase}

.iconbtn{width:38px;height:38px;border-radius:50%;border:.5px solid rgba(255,255,255,.24);
  background:rgba(255,255,255,.12);color:#fff;cursor:pointer;
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  display:flex;align-items:center;justify-content:center;
  transition:transform .26s var(--ease),background .25s}
.iconbtn:active{transform:scale(.9)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ───────── 城市搜索 ───────── */
.searchwrap{display:flex;flex-direction:column;gap:9px}
.search{display:flex;align-items:center;gap:9px;padding:5px 5px 5px 15px;border-radius:99px;
  background:rgba(255,255,255,.15);border:.5px solid rgba(255,255,255,.26);
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  transition:background .25s,border-color .25s}
.search:focus-within{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.45)}
.search .ico{flex:none;width:17px;height:17px;stroke:rgba(255,255,255,.66);fill:none;
  stroke-width:2;stroke-linecap:round}
.search input{flex:1;min-width:0;background:none;border:none;outline:none;color:#fff;
  font-size:15px;font-family:inherit;padding:9px 0;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:rgba(255,255,255,.46)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.sbtn{flex:none;width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(255,255,255,.92);color:#14161c;
  display:flex;align-items:center;justify-content:center;
  transition:transform .26s var(--ease),opacity .25s}
.sbtn:active{transform:scale(.9)}
.sbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round}

.recent{display:flex;gap:7px;overflow-x:auto;padding:0 2px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.rhint{flex:none;font-size:11.5px;color:rgba(255,255,255,.42);align-self:center;letter-spacing:.3px}
.rchip{flex:none;padding:7px 13px;border-radius:99px;font-size:12.5px;font-family:inherit;
  color:rgba(255,255,255,.82);background:rgba(255,255,255,.10);
  border:.5px solid rgba(255,255,255,.18);cursor:pointer;white-space:nowrap;
  transition:all .25s var(--ease)}
.rchip:active{transform:scale(.93)}
.rchip[aria-current="true"]{background:rgba(255,255,255,.90);color:#14161c;font-weight:600;
  border-color:transparent}

/* ───────── 玻璃砖 ───────── */
.glass{position:relative;border-radius:var(--r);background:var(--card);
  border:1px solid var(--card-brd);
  -webkit-backdrop-filter:blur(52px) saturate(190%);backdrop-filter:blur(52px) saturate(190%);
  box-shadow:var(--shadow),inset 0 1px 0 var(--hi);
  overflow:hidden;transition:background .45s var(--ease),border-color .45s var(--ease)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(135% 62% at 6% -16%,var(--sheen),transparent 58%)}
.glass::after{content:"";position:absolute;left:8%;right:8%;top:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);opacity:.8}
.card{padding:17px 17px 19px}
.card>*{position:relative;z-index:1}

.h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.h h2{font-size:12.5px;font-weight:600;letter-spacing:.5px;color:var(--ink2)}
.h .meta{font-size:11.5px;color:var(--ink3);letter-spacing:.3px}

/* 当前天气 */
.now{display:flex;align-items:center;gap:14px}
.nowicon{width:74px;height:74px;flex:none;color:var(--acc);transition:color .6s}
.nowicon svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2.1;
  stroke-linecap:round;stroke-linejoin:round}
.nowmain{flex:1;min-width:0}
.temp{display:flex;align-items:flex-start;gap:2px;line-height:1}
.temp b{font-size:64px;font-weight:300;letter-spacing:-2.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.temp span{font-size:20px;font-weight:400;color:var(--ink2);margin-top:8px}
.cond{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:15px;color:var(--ink2)}
.cond .sepdot{width:3px;height:3px;border-radius:50%;background:var(--ink3)}
.updated{margin-top:12px;font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:6px}

/* 预报 */
.fc{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.day{padding:13px 8px 14px;border-radius:16px;background:var(--fill);
  border:1px solid var(--fill-brd);text-align:center}
.day .dw{font-size:11.5px;color:var(--ink3);letter-spacing:.3px}
.day .di{width:30px;height:30px;margin:9px auto 8px;color:var(--acc)}
.day .di svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.day .dt{font-size:11px;color:var(--ink3);margin-bottom:7px;line-height:1.3}
.day .th{font-size:14px;color:var(--ink);font-weight:600}
.day .tl{font-size:13px;color:var(--ink3);margin-left:4px;font-weight:400}

/* 生活指数 */
.life{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.li{padding:12px 10px;border-radius:15px;background:var(--fill);
  border:1px solid var(--fill-brd)}
.li .ln{font-size:11px;color:var(--ink3);letter-spacing:.3px}
.li .lv{font-size:14px;color:var(--ink);font-weight:600;margin-top:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* JSON 原文 */
.raw{margin-top:2px}
.raw summary{list-style:none;cursor:pointer;font-size:13px;color:var(--ink2);
  display:flex;align-items:center;justify-content:space-between;padding:2px 0}
.raw summary::-webkit-details-marker{display:none}
.raw summary::after{content:"";width:7px;height:7px;border-right:1.6px solid var(--ink3);
  border-bottom:1.6px solid var(--ink3);transform:rotate(45deg);transition:transform .25s var(--ease);
  margin-left:8px;margin-top:-3px}
.raw[open] summary::after{transform:rotate(-135deg);margin-top:3px}
.code{margin-top:12px;padding:14px;border-radius:14px;background:rgba(20,26,40,.92);
  color:#d6e2f5;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11.5px;line-height:1.65;overflow:auto;max-height:280px;white-space:pre;
  -webkit-overflow-scrolling:touch}
.code .k{color:#7fb6ff}.code .s{color:#9de3c0}.code .n{color:#ffc978}.code .b{color:#d9a6ff}
.pathhint{margin-top:10px;font-size:11px;color:var(--ink3);line-height:1.7;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* 状态条 */
.notice{padding:12px 15px;border-radius:16px;font-size:12.5px;line-height:1.6;
  background:var(--fill);border:1px solid var(--fill-brd);color:var(--ink2);
  display:flex;gap:10px;align-items:flex-start}
.notice .ni{flex:none;width:16px;height:16px;margin-top:1px;color:var(--acc)}
.notice .ni svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.notice b{color:var(--ink)}
.notice button{border:none;background:none;color:var(--link);font:inherit;font-weight:600;
  cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}

/* 设置面板 */
.sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.38);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  opacity:0;transition:opacity .3s}
.sheet.open{display:flex;opacity:1}
.panel{width:100%;max-width:440px;border-radius:28px 28px 0 0;padding:9px 20px 26px;
  background:rgba(30,34,46,.92);border-top:.5px solid rgba(255,255,255,.20);
  -webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);
  color:#fff;transform:translateY(100%);transition:transform .42s var(--ease);
  max-height:88vh;overflow-y:auto}
.sheet.open .panel{transform:translateY(0)}
.handle{width:36px;height:5px;border-radius:99px;background:rgba(255,255,255,.28);margin:0 auto 16px}
.panel h3{font-size:16px;font-weight:600;margin-bottom:5px}
.panel .desc{font-size:12.5px;color:rgba(255,255,255,.45);line-height:1.6;margin-bottom:16px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:rgba(255,255,255,.62);margin-bottom:7px;letter-spacing:.4px}
.field input[type=text],.field input[type=password],.field select{
  width:100%;padding:13px 15px;border-radius:13px;font-size:15px;font-family:inherit;
  color:#fff;background:rgba(255,255,255,.08);border:.5px solid rgba(255,255,255,.16);outline:none}
.field select{appearance:none;background-image:none}
.field input:focus,.field select:focus{border-color:rgba(255,255,255,.42);background:rgba(255,255,255,.13)}
.field .hint{font-size:11px;color:rgba(255,255,255,.38);margin-top:6px;line-height:1.5}
.field .hint a{color:rgba(127,182,255,.95);text-decoration:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:600;
  font-family:inherit;color:#fff;cursor:pointer;margin-top:4px;
  background:linear-gradient(180deg,#4a8cf7,#2f6ee0);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px -8px rgba(0,0,0,.6);
  transition:transform .26s var(--ease),filter .2s}
.btn:active{transform:scale(.97);filter:brightness(1.08)}
.btn.ghost{background:rgba(255,255,255,.12);border:.5px solid rgba(255,255,255,.22);
  font-weight:500;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,18px);
  z-index:30;padding:11px 19px;border-radius:99px;font-size:13px;white-space:nowrap;
  background:rgba(28,32,44,.92);border:.5px solid rgba(255,255,255,.16);color:#fff;
  -webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);
  opacity:0;pointer-events:none;transition:opacity .28s,transform .34s var(--ease);max-width:88vw;
  overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}

.spin{animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="bg">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<main class="app">

  <header class="top">
    <div class="brand">
      <h1 id="cityName">正在定位</h1>
      <p id="cityPath">ESP32 · JSON 天气</p>
    </div>
    <button class="iconbtn" id="refresh" aria-label="刷新天气">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="iconbtn" id="settings" aria-label="设置">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <!-- 城市切换 -->
  <div class="searchwrap">
    <form class="search" id="searchForm" role="search">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
      <input id="citySearch" type="text" inputmode="search" enterkeyhint="search"
             placeholder="搜索城市，如 石家庄" autocomplete="off" aria-label="搜索城市">
      <button class="sbtn" type="submit" aria-label="查询天气">
        <svg viewBox="0 0 24 24"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
      </button>
    </form>
    <div class="recent" id="recent" hidden></div>
  </div>

  <!-- 当前 -->
  <section class="glass card">
    <div class="h">
      <h2>实时天气</h2>
      <span class="meta" id="sourceTag">演示数据</span>
    </div>
    <div class="now">
      <div class="nowicon" id="nowIcon"></div>
      <div class="nowmain">
        <div class="temp"><b id="temp">--</b><span>℃</span></div>
        <div class="cond"><span id="cond">—</span><i class="sepdot"></i><span id="codeTag">代码 —</span></div>
      </div>
    </div>
    <div class="updated">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span id="updated">—</span>
    </div>
  </section>

  <!-- 预报 -->
  <section class="glass card">
    <div class="h">
      <h2>未来三天</h2>
      <span class="meta" id="fcTag">白天 / 夜间</span>
    </div>
    <div class="fc" id="forecast"></div>
  </section>

  <!-- 生活指数 -->
  <section class="glass card">
    <div class="h">
      <h2>生活指数</h2>
      <span class="meta">心知天气</span>
    </div>
    <div class="life" id="life"></div>
  </section>

  <!-- JSON 原文 -->
  <section class="glass card">
    <details class="raw" id="rawBox">
      <summary>接口返回的 JSON 原文</summary>
      <div class="code" id="code"></div>
      <div class="pathhint" id="pathhint"></div>
    </details>
  </section>

  <div class="notice" id="notice" hidden>
    <i class="ni"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg></i>
    <div id="noticeText"></div>
  </div>

</main>

<div class="sheet" id="sheet">
  <div class="panel">
    <div class="handle"></div>
    <h3>数据源设置</h3>
    <p class="desc">填入心知天气私钥后即可显示真实天气。<br>密钥只存在这台设备的浏览器里，不会上传到任何服务器。</p>

    <div class="field">
      <label>心知天气私钥</label>
      <input type="password" id="keyInput" placeholder="粘贴私钥（32 位左右）" autocomplete="off">
      <div class="hint">控制台 → 产品管理 → 天气实况 → 私钥。<a href="https://www.seniverse.com/dashboard" target="_blank" rel="noopener">去获取</a></div>
    </div>

    <div class="field">
      <label>温度单位</label>
      <select id="unitInput">
        <option value="c">摄氏度 ℃</option>
        <option value="f">华氏度 ℉</option>
      </select>
      <div class="hint">城市在主界面顶部的搜索框里切换，支持中文、拼音和城市 ID。</div>
    </div>

    <button class="btn" id="save">保存并刷新</button>
    <button class="btn ghost" id="reset" style="margin-top:9px">清除密钥，回到演示数据</button>
    <button class="btn ghost" id="close" style="margin-top:9px">关闭</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  /* 首次打开用北京；之后完全由搜索决定 */
  const DEFAULT_CITY = { q: 'beijing', n: '北京' };

  const LS = {
    key: 'wx.key', city: 'wx.city', unit: 'wx.unit', cache: 'wx.cache',
    theme: 'wx.theme', recent: 'wx.recent',
  };
  const state = {
    key: localStorage.getItem(LS.key) || '',
    city: localStorage.getItem(LS.city) || 'beijing',
    unit: localStorage.getItem(LS.unit) || 'c',
    theme: localStorage.getItem(LS.theme) || 'light',
    displayName: '',
    recent: [],
    data: null,
  };
  const CACHE_MS = 10 * 60 * 1000;   // 教程建议：10 分钟一次，省配额

  const $ = (s) => document.querySelector(s);
  const el = {
    cityName: $('#cityName'), cityPath: $('#cityPath'), temp: $('#temp'), cond: $('#cond'),
    codeTag: $('#codeTag'), updated: $('#updated'), sourceTag: $('#sourceTag'),
    nowIcon: $('#nowIcon'), forecast: $('#forecast'), life: $('#life'),
    code: $('#code'), pathhint: $('#pathhint'), notice: $('#notice'), noticeText: $('#noticeText'),
    sheet: $('#sheet'), keyInput: $('#keyInput'), unitInput: $('#unitInput'),
    toast: $('#toast'), refresh: $('#refresh'), fcTag: $('#fcTag'),
    searchForm: $('#searchForm'), searchInput: $('#citySearch'), recent: $('#recent'),
  };

  let toastTimer;
  const toast = (m) => {
    el.toast.textContent = m; el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2200);
  };

  /* ───── 天气图标（对应心知天气 code）───── */
  const SVG = {
    sun: `<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/>`,
    cloud: `<path d="M7 18h9.5a3.2 3.2 0 0 0 .3-6.4A5 5 0 0 0 7.3 10 4 4 0 0 0 7 18z"/>`,
    rain: `<path d="M7 15h9.5a3.2 3.2 0 0 0 .3-6.4A5 5 0 0 0 7.3 7 4 4 0 0 0 7 15z"/><path d="M9 18l-1 2.4M13 18l-1 2.4M17 18l-1 2.4"/>`,
    snow: `<path d="M7 15h9.5a3.2 3.2 0 0 0 .3-6.4A5 5 0 0 0 7.3 7 4 4 0 0 0 7 15z"/><path d="M9 19h.01M13 19h.01M17 19h.01M11 21.5h.01M15 21.5h.01"/>`,
  };

  /* 天气类型的线条颜色：晴=暖黄，雨=蓝，雪=浅蓝，云=灰蓝 */
  function toneOf(code) {
    const c = parseInt(code, 10);
    if (Number.isNaN(c)) return '#8fa3bf';
    if ([0, 1].includes(c)) return '#f0a12e';
    if ([13, 19, 20, 21, 22, 23, 24, 25].includes(c)) return '#9ec5f5';
    if ((c >= 3 && c <= 12) || (c >= 14 && c <= 18)) return '#3f95e8';
    return '#8fa3bf';
  }

  function iconOf(code) {
    const c = parseInt(code, 10);
    if (Number.isNaN(c)) return SVG.cloud;
    if ([0, 1].includes(c)) return SVG.sun;
    if ([30, 31].includes(c)) return SVG.cloud;
    if ([13, 19, 20, 21, 22, 23, 24, 25].includes(c)) return SVG.snow;
    if (c >= 3 && c <= 12) return SVG.rain;
    if (c >= 14 && c <= 18) return SVG.rain;
    if (c >= 26) return SVG.cloud;
    return SVG.cloud;
  }

  function skyOf(code, hour) {
    const c = parseInt(code, 10);
    if ([13, 19, 20, 21, 22, 23, 24, 25].includes(c)) return 'snow';
    if ((c >= 3 && c <= 12) || (c >= 14 && c <= 18)) return 'rain';
    if ([30, 31, 32, 33, 34, 35, 36].includes(c)) return 'cloud';
    // 晴：按当地时间判断昼夜
    if (hour !== null && (hour < 6 || hour >= 19)) return 'night';
    return 'clear';
  }

  /* ───── 演示数据（结构与真实接口一致）───── */
  const DEMO = {
    now: {
      results: [{
        location: { id: 'WX4FBXXFKE4F', name: '北京', country: 'CN', path: '北京,北京,中国', timezone: 'Asia/Shanghai', timezone_offset: '+08:00' },
        now: { text: '晴', code: '0', temperature: '24' },
        last_update: new Date().toISOString().replace(/\.\d{3}Z$/, '+00:00'),
      }],
    },
    daily: {
      results: [{
        location: { id: 'WX4FBXXFKE4F', name: '北京', country: 'CN', path: '北京,北京,中国', timezone: 'Asia/Shanghai', timezone_offset: '+08:00' },
        daily: [
          { date: '2026-10-26', text_day: '晴', code_day: '0', text_night: '晴', code_night: '0', high: '25', low: '11', wind_direction: '北', wind_speed: '12', wind_scale: '2', humidity: '45' },
          { date: '2026-10-27', text_day: '多云', code_day: '4', text_night: '阴', code_night: '9', high: '22', low: '12', wind_direction: '东南', wind_speed: '9', wind_scale: '2', humidity: '52' },
          { date: '2026-10-28', text_day: '小雨', code_day: '9', text_night: '多云', code_night: '4', high: '18', low: '10', wind_direction: '东北', wind_speed: '16', wind_scale: '3', humidity: '68' },
        ],
        last_update: '2026-10-26T10:00:00+08:00',
      }],
    },
    life: {
      results: [{
        location: { id: 'WX4FBXXFKE4F', name: '北京', country: 'CN', path: '北京,北京,中国' },
        suggestion: [
          { name: '穿衣', code: 'dressing', category: '较舒适' },
          { name: '紫外线', code: 'uv', category: '中等' },
          { name: '洗车', code: 'car_washing', category: '适宜' },
          { name: '旅游', code: 'travel', category: '适宜' },
          { name: '感冒', code: 'flu', category: '少发' },
          { name: '运动', code: 'sport', category: '较适宜' },
        ],
        last_update: '2026-10-26T10:00:00+08:00',
      }],
    },
  };

  /* ───── 请求 ───── */
  const ENDPOINTS = {
    now: (city, unit, key) => `https://api.seniverse.com/v3/weather/now.json?key=${encodeURIComponent(key)}&location=${encodeURIComponent(city)}&language=zh-Hans&unit=${unit}`,
    daily: (city, unit, key) => `https://api.seniverse.com/v3/weather/daily.json?key=${encodeURIComponent(key)}&location=${encodeURIComponent(city)}&language=zh-Hans&unit=${unit}&start=0&days=3`,
    life: (city, unit, key) => `https://api.seniverse.com/v3/life/suggestion.json?key=${encodeURIComponent(key)}&location=${encodeURIComponent(city)}&language=zh-Hans`,
  };

  async function fetchJson(url) {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), 12000);
    const r = await fetch(url, { signal: c.signal, cache: 'no-store' });
    clearTimeout(t);
    const j = await r.json();
    if (j.status_code) throw new Error(j.status || j.status_code);
    return j;
  }

  async function load(force) {
    if (!state.key) { render(DEMO, true); setNotice(true); return; }

    const cached = JSON.parse(localStorage.getItem(LS.cache) || 'null');
    if (!force && cached && cached.at && Date.now() - cached.at < CACHE_MS
        && cached.city === state.city && cached.unit === state.unit) {
      render(cached.data, false);
      return;
    }

    el.refresh.classList.add('spin');
    try {
      const [now, daily, life] = await Promise.all([
        fetchJson(ENDPOINTS.now(state.city, state.unit, state.key)),
        fetchJson(ENDPOINTS.daily(state.city, state.unit, state.key)).catch(() => null),
        fetchJson(ENDPOINTS.life(state.city, state.unit, state.key)).catch(() => null),
      ]);
      const data = { now, daily, life };
      localStorage.setItem(LS.cache, JSON.stringify({
        at: Date.now(), city: state.city, unit: state.unit, data,
      }));
      render(data, false);
      setNotice(false);
    } catch (e) {
      // 失败时回落到缓存或演示数据，并说明原因
      if (cached && cached.data) { render(cached.data, false); toast('刷新失败，显示上次数据'); }
      else { render(DEMO, true); setNotice(true, String(e.message || e)); }
    } finally {
      el.refresh.classList.remove('spin');
    }
  }

  /* ───── 渲染 ───── */
  /* ───── 城市搜索 ───── */
  function loadRecent() {
    try { return JSON.parse(localStorage.getItem(LS.recent) || '[]'); } catch (e) { return []; }
  }

  function pushRecent(q, n) {
    const key = String(q).toLowerCase();
    state.recent = [{ q, n: n || q }, ...state.recent.filter((x) => x.q.toLowerCase() !== key)]
      .slice(0, 5);
    localStorage.setItem(LS.recent, JSON.stringify(state.recent));
  }

  function renderRecent() {
    if (!state.recent.length) { el.recent.hidden = true; el.recent.innerHTML = ''; return; }
    el.recent.hidden = false;
    const cur = state.city.toLowerCase();
    el.recent.innerHTML = '<span class="rhint">最近</span>' + state.recent.map((c) => `
      <button type="button" class="rchip" data-q="${escapeHtml(c.q)}"
        aria-current="${c.q.toLowerCase() === cur}">${escapeHtml(c.n)}</button>`).join('');
    el.recent.querySelectorAll('.rchip').forEach((b) => {
      b.onclick = () => doSearch(b.dataset.q, b.textContent);
    });
  }

  function doSearch(raw, label) {
    const term = String(raw || '').trim();
    if (!term) { toast('请输入城市名'); el.searchInput.focus(); return; }
    state.city = term;
    state.displayName = label || term;
    localStorage.setItem(LS.city, term);
    pushRecent(term, label || term);
    renderRecent();
    toast('查询 ' + (label || term));
    load(true);
  }

  function setNotice(show, reason) {
    el.notice.hidden = !show;
    if (!show) return;
    el.noticeText.innerHTML = reason
      ? `接口返回：<b>${escapeHtml(reason)}</b><br>检查私钥是否正确、额度是否用完，或城市名是否可识别。<button id="goSet">重新设置</button>`
      : `当前是<b>演示数据</b>。填入心知天气私钥后显示真实天气。<button id="goSet">去设置</button>`;
    const b = document.getElementById('goSet');
    if (b) b.onclick = openSheet;
  }

  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function fmtUpdate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return iso;
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    return `${hh}:${mm} 更新`;
  }

  function fmtDay(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    if (Number.isNaN(d.getTime())) return dateStr;
    const w = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
    return `${w}`;
  }

  function render(data, isDemo) {
    state.data = data;
    const r0 = data.now && data.now.results && data.now.results[0];
    if (!r0) return;

    const loc = r0.location || {};
    const now = r0.now || {};
    const hour = new Date().getHours();

    // 演示数据的城市名是写死的，切换城市时以所选城市为准
    const cityLabel = isDemo ? (state.displayName || loc.name || state.city)
                             : (loc.name || state.city);
    el.cityName.textContent = cityLabel;
    el.cityPath.textContent = isDemo ? '演示数据 · 非实时'
                                     : (loc.path || 'ESP32 · JSON 天气').toUpperCase();
    el.temp.textContent = now.temperature != null ? now.temperature : '--';
    el.cond.textContent = now.text || '—';
    el.codeTag.textContent = '代码 ' + (now.code != null ? now.code : '—');
    el.updated.textContent = fmtUpdate(r0.last_update);
    el.sourceTag.textContent = isDemo ? '演示数据' : '心知天气';

    el.nowIcon.style.color = toneOf(now.code);
    el.nowIcon.innerHTML = `<svg viewBox="0 0 24 24">${iconOf(now.code)}</svg>`;
    document.documentElement.dataset.sky = skyOf(now.code, hour);

    // 单位符号
    const unitSym = document.querySelector('.temp span');
    if (unitSym) unitSym.textContent = state.unit === 'f' ? '℉' : '℃';

    // 预报
    const days = (data.daily && data.daily.results && data.daily.results[0] &&
      data.daily.results[0].daily) || [];
    el.forecast.innerHTML = days.slice(0, 3).map((d) => `
      <div class="day">
        <div class="dw">${escapeHtml(fmtDay(d.date))}</div>
        <div class="di" style="color:${toneOf(d.code_day)}"><svg viewBox="0 0 24 24">${iconOf(d.code_day)}</svg></div>
        <div class="dt">${escapeHtml(d.text_day || '')}</div>
        <div><span class="th">${escapeHtml(d.high ?? '—')}°</span><span class="tl">${escapeHtml(d.low ?? '—')}°</span></div>
      </div>`).join('') || `<div class="day" style="grid-column:1/-1;color:var(--ink3)">暂无预报数据</div>`;

    // 生活指数
    const sug = (data.life && data.life.results && data.life.results[0] &&
      data.life.results[0].suggestion) || [];
    el.life.innerHTML = sug.slice(0, 6).map((s) => `
      <div class="li">
        <div class="ln">${escapeHtml(s.name || '')}</div>
        <div class="lv">${escapeHtml(s.category || s.brief || '—')}</div>
      </div>`).join('') || `<div class="li" style="grid-column:1/-1;color:var(--ink3)">暂无指数数据</div>`;

    // JSON 原文
    const rawText = JSON.stringify(data.now, null, 2);
    el.code.innerHTML = highlight(rawText);
    el.pathhint.textContent =
      '取值路径：results[0].now.temperature  →  ' +
      (now.temperature != null ? now.temperature : '—');

    // 用接口返回的官方城市名修正显示（搜索词可能和官方名不同）
    if (!isDemo && loc.name) {
      state.displayName = loc.name;
      const hit = state.recent.find((x) => x.q.toLowerCase() === state.city.toLowerCase());
      if (hit && hit.n !== loc.name) { hit.n = loc.name; localStorage.setItem(LS.recent, JSON.stringify(state.recent)); renderRecent(); }
    }

    document.title = `${cityLabel} ${now.temperature != null ? now.temperature + '°' : ''} · 实时天气`;
  }

  function highlight(json) {
    return escapeHtml(json).replace(
      /(&quot;(?:\\.|[^&])*?&quot;)(\s*:)?|(\b-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b)|\b(true|false|null)\b/g,
      (m, str, colon, num, lit) => {
        if (str) return colon ? `<span class="k">${str}</span>${colon}` : `<span class="s">${str}</span>`;
        if (num) return `<span class="n">${num}</span>`;
        if (lit) return `<span class="b">${lit}</span>`;
        return m;
      });
  }

  /* ───── 设置 ───── */
  function openSheet() {
    el.keyInput.value = state.key;
    el.unitInput.value = state.unit;
    el.sheet.classList.add('open');
  }
  const closeSheet = () => el.sheet.classList.remove('open');

  $('#settings').onclick = openSheet;
  $('#close').onclick = closeSheet;
  el.sheet.addEventListener('click', (e) => { if (e.target === el.sheet) closeSheet(); });

  $('#save').onclick = () => {
    state.key = el.keyInput.value.trim();
    state.unit = el.unitInput.value;
    localStorage.setItem(LS.key, state.key);
    localStorage.setItem(LS.unit, state.unit);
    localStorage.removeItem(LS.cache);
    closeSheet();
    toast(state.key ? '已保存，正在获取' : '未填私钥，保持演示模式');
    load(true);
  };

  $('#reset').onclick = () => {
    state.key = '';
    localStorage.removeItem(LS.key);
    localStorage.removeItem(LS.cache);
    closeSheet();
    render(DEMO, true);
    setNotice(true);
    toast('已回到演示数据');
  };

  el.refresh.onclick = () => { load(true); toast('正在刷新'); };

  el.searchForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const term = el.searchInput.value.trim();
    doSearch(term);
    if (term) el.searchInput.value = '';   // 清空，避免与当前城市不一致
    el.searchInput.blur();
  });

  /* 主题：跟随系统，也记手动选择 */
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    localStorage.setItem(LS.theme, t);
  }
  applyTheme(state.theme);

  /* 启动 */
  state.recent = loadRecent();
  const savedHit = state.recent.find(
    (x) => x.q.toLowerCase() === state.city.toLowerCase());
  state.displayName = savedHit ? savedHit.n
    : (state.city.toLowerCase() === DEFAULT_CITY.q ? DEFAULT_CITY.n : state.city);
  renderRecent();
  load(false);

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
